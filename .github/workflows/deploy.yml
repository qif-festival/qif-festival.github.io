# Construit le site et le publie sur GitHub Pages à chaque push sur main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Construire
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Garde-fou : si le HTML servi ne contient plus le contenu, on échoue ici
      # plutôt que de mettre en ligne une page vide pour les moteurs.
      - name: Vérifier que le HTML est bien pré-rendu
        run: |
          grep -q "Emile Decorps" dist/index.html
          grep -q "<h1" dist/index.html
          echo "contenu présent dans le HTML servi"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
